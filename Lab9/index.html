<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота 10</title>
</head>
<body>

<h2>Список продуктів з API</h2>
<button onclick="loadProducts()">Завантажити продукти</button>
<div id="result"></div>

<script>
    function loadProducts() {
        fetch('https://fakestoreapi.com/products?limit=5')
            .then(response => response.json())
            .then(data => {
                let html = "<ul>";
                for (let i = 0; i < data.length; i++) {
                    html += "<li>" + data[i].title + " - $" + data[i].price + "</li>";
                }
                html += "</ul>";
                document.getElementById("result").innerHTML = html;
            })
            .catch(error => {
                document.getElementById("result").innerHTML = "Помилка завантаження даних!";
            });
    }
</script>

</body>
</html>
