<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №10 - DummyJSON Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Каталог товарів (DummyJSON API)</h1>
        <div class="controls">
            <input type="text" id="search-input" placeholder="Пошук товару...">
            <button onclick="searchProducts()">Знайти</button>
            <select id="category-select" onchange="filterByCategory()">
                <option value="all">Усі категорії</option>
            </select>
        </div>
    </header>

    <main>
        <div id="products-container"></div>
    </main>

    <script src="index.js"></script>
</body>
</html>
