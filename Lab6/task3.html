<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №6 - Завдання 3</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        td, th {
            border: 1px solid #333;
            width: 40px;
            height: 40px;
            text-align: center;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        td {
            background-color: #ecf0f1;
        }
    </style>
</head>
<body>
<script>
    document.write("<table>");
    for (let i = 1; i <= 10; i++) {
        document.write("<tr>");
        for (let j = 1; j <= 10; j++) {
            if (i === 1 || j === 1) {
                document.write("<th>" + (i * j) + "</th>");
            } else {
                document.write("<td>" + (i * j) + "</td>");
            }
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>
</body>
</html>
