<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота 6</title>
</head>
<body>

<script>
    let salaryInput = prompt("Введіть суму зарплати:");
    let salary = parseFloat(salaryInput);

    if (isNaN(salary) || salary < 0) {
        alert("Будь ласка, введіть коректне число!");
    } else {
        let bonus = salary * 0.15;
        let totalWithBonus = salary + bonus;
        let tax = totalWithBonus * 0.18;
        let finalAmount = totalWithBonus - tax;

        alert("Зарплата: " + salary + "\n" +
              "Премія (15%): " + bonus + "\n" +
              "Сума з премією: " + totalWithBonus + "\n" +
              "Податок (18%): " + tax + "\n" +
              "Сума до видачі: " + finalAmount);
    }
</script>

</body>
</html>
